<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASE FILES: Business Ethics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-soft:#5B6675;
    --paper:#F3EEE1;
    --paper-card:#FFFDF7;
    --paper-line:#DCD4BC;
    --brass:#B9862B;
    --brass-light:#E7C583;
    --red:#A8384A;
    --red-bg:#F6E3E4;
    --green:#3E7A68;
    --green-bg:#E4EEE7;
    --font-th:'IBM Plex Sans Thai','Noto Sans SC',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-th);
    background:
      radial-gradient(circle at 1px 1px, rgba(27,36,48,0.06) 1px, transparent 0) 0 0/22px 22px,
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  @media (min-width:700px){
    body{ background-attachment:fixed; }
    .app{
      max-width:640px;
      min-height:auto;
      margin:32px auto;
      border-radius:10px;
      box-shadow:0 20px 60px -30px rgba(27,36,48,.35);
      overflow:hidden;
    }
  }
  @media (min-width:1000px){
    .app{ max-width:680px; }
  }
  /* ---------- HEADER ---------- */
  .topbar{
    background:var(--ink);
    color:var(--paper);
    padding:16px 20px 14px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand .kicker{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:2px;
    color:var(--brass-light);
    text-transform:uppercase;
  }
  .brand .title{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .lang-switch{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;gap:2px;}
  .lang-btn{
    font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:.5px;
    background:transparent;border:none;color:rgba(243,238,225,.6);
    padding:6px 10px;border-radius:999px;cursor:pointer;
  }
  .lang-btn.active{background:var(--brass);color:var(--ink);}
  .lb-btn{
    font-family:var(--font-th);
    font-size:13.5px;font-weight:600;
    background:transparent;
    border:1px solid var(--brass);
    color:var(--brass-light);
    padding:8px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    display:flex;align-items:center;gap:6px;
    transition:background .15s ease;
  }
  .lb-btn:hover{background:rgba(185,134,43,.15);}
  .lb-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .progress-row{display:flex;gap:5px;margin-top:12px;}
  .progress-dot{
    flex:1;height:4px;border-radius:2px;
    background:rgba(255,255,255,.15);
    overflow:hidden;
  }
  .progress-dot.done{background:var(--brass);}
  .progress-dot.current{background:rgba(231,197,131,.5);}

  /* ---------- MAIN ---------- */
  .main{flex:1;padding:22px 18px 40px;display:flex;flex-direction:column;gap:16px;}

  /* ---------- INTRO ---------- */
  .intro-card{
    background:var(--paper-card);
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:28px 22px;
    box-shadow:0 1px 0 var(--paper-line), 0 8px 24px -14px rgba(27,36,48,.25);
    position:relative;
  }
  .folder-tab{
    position:absolute;top:-14px;left:22px;
    background:var(--brass);
    color:var(--ink);
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:1.5px;
    padding:6px 13px;
    border-radius:3px 3px 0 0;
    transform:rotate(-1.2deg);
    font-weight:700;
  }
  .intro-card h1{
    font-size:20px;line-height:1.4;margin:10px 0 8px;
  }
  .intro-card p{
    font-size:14.5px;line-height:1.7;color:var(--ink-soft);margin:0 0 18px;
  }
  .case-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;}
  .case-chip{
    font-size:13px;background:var(--ink);border:none;
    padding:6px 12px;border-radius:999px;color:var(--brass-light);cursor:default;
  }
  .field-label{
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:1px;
    color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;display:block;
  }
  .field-group{margin-bottom:14px;}
  input.text-input{
    width:100%;
    font-family:var(--font-th);
    font-size:15.5px;
    padding:13px 14px;
    border:1.5px solid var(--paper-line);
    border-radius:4px;
    background:var(--paper);
  }
  input.text-input:focus{outline:none;border-color:var(--brass);}
  .privacy-note{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:2px 0 18px;}
  .btn-primary{
    width:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-th);
    font-weight:600;
    font-size:15px;
    padding:14px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .btn-primary:hover{background:#2A3547;}
  .btn-primary:active{transform:scale(.98);}

  /* ---------- QUESTION CARD ---------- */
  .case-card{
    background:var(--paper-card);
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:24px 20px 22px;
    position:relative;
    box-shadow:0 1px 0 var(--paper-line), 0 8px 24px -14px rgba(27,36,48,.25);
  }
  .case-meta{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
  .case-icon{
    width:38px;height:38px;border-radius:8px;
    background:var(--paper);border:1px solid var(--paper-line);
    display:flex;align-items:center;justify-content:center;font-size:19px;
    flex-shrink:0;
  }
  .case-meta-text .case-no{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.5px;color:var(--brass);
    text-transform:uppercase;font-weight:700;
  }
  .case-meta-text .case-cat{font-size:13px;color:var(--ink-soft);}
  .bonus-card{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass), 0 8px 24px -14px rgba(27,36,48,.25);}
  .bonus-icon{background:var(--brass);border-color:var(--brass);}
  .bonus-badge{
    display:inline-block;background:var(--brass);color:var(--ink);
    font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;padding:2px 7px;border-radius:999px;vertical-align:middle;
  }
  .scenario-text{
    font-size:16px;line-height:1.75;font-weight:500;margin:6px 0 20px;
  }
  .scenario-text p{margin:0 0 12px;}
  .scenario-text p:last-child{margin-bottom:0;}
  .prompt-label{
    font-family:var(--font-th);font-size:14.5px;font-weight:600;line-height:1.6;
    color:var(--ink);margin-bottom:10px;
  }
  .photo-hint{font-size:12.5px;color:var(--ink-soft);margin:-4px 0 16px;}
  .photo-grid{
    display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:20px;
  }
  .photo-thumb{
    position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;
    border:1px solid var(--paper-line);background:var(--paper);
  }
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-remove{
    position:absolute;top:4px;right:4px;
    width:20px;height:20px;border-radius:50%;
    background:rgba(27,36,48,.75);color:#fff;border:none;
    font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  .photo-add-tile{
    aspect-ratio:1;border-radius:6px;border:1.5px dashed var(--paper-line);
    display:flex;align-items:center;justify-content:center;text-align:center;
    cursor:pointer;color:var(--brass);font-size:12px;font-weight:600;padding:6px;
    background:var(--paper);
  }
  .photo-add-tile:hover{border-color:var(--brass);}
  .photo-actions{display:flex;gap:10px;}
  .photo-actions .btn-next{margin-top:0;flex:1.4;}
  .btn-skip{
    flex:1;
    background:transparent;color:var(--ink-soft);
    font-family:var(--font-th);font-weight:600;font-size:14.5px;
    padding:13px;border:1.5px solid var(--paper-line);border-radius:4px;cursor:pointer;
  }
  .btn-skip:hover{border-color:var(--ink-soft);color:var(--ink);}
  .options{display:flex;flex-direction:column;gap:9px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;
    text-align:left;
    background:var(--paper);
    border:1.5px solid var(--paper-line);
    border-radius:4px;
    padding:12px 13px;
    cursor:pointer;
    font-family:var(--font-th);
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
    transition:border-color .12s ease, background .12s ease;
  }
  .option:hover{border-color:var(--brass);}
  .option .opt-letter{
    font-family:var(--font-mono);
    font-weight:700;font-size:13px;
    width:24px;height:24px;border-radius:5px;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;margin-top:1px;
  }
  .option.correct{border-color:var(--green);background:var(--green-bg);}
  .option.correct .opt-letter{background:var(--green);}
  .option.wrong-selected{border-color:var(--red);background:var(--red-bg);}
  .option.wrong-selected .opt-letter{background:var(--red);}
  .option.disabled{cursor:default;}
  .option.dim{opacity:.5;}
  .option.missed{border-color:var(--brass);background:rgba(185,134,43,.12);}
  .option.ms-checked{border-color:var(--brass);background:rgba(185,134,43,.08);}
  .opt-checkbox{
    font-family:var(--font-mono);font-weight:700;font-size:13px;
    width:24px;height:24px;border-radius:5px;
    background:var(--paper-card);border:1.5px solid var(--paper-line);color:var(--brass);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;margin-top:1px;
  }
  .option.correct .opt-checkbox{background:var(--green);border-color:var(--green);color:#fff;}
  .option.wrong-selected .opt-checkbox{background:var(--red);border-color:var(--red);color:#fff;}
  .option.missed .opt-checkbox{background:var(--brass);border-color:var(--brass);color:#fff;}
  .option.ms-checked .opt-checkbox{border-color:var(--brass);color:var(--brass);}
  .ms-explain-list{display:flex;flex-direction:column;gap:9px;}
  .ms-explain-item{
    font-size:13.5px;line-height:1.7;color:var(--ink-soft);
    background:var(--paper);border:1px solid var(--paper-line);border-radius:4px;
    padding:9px 11px;
  }
  #confirmMultiBtn:disabled{opacity:.4;cursor:not-allowed;}

  /* stamp */
  .stamp-wrap{position:relative;height:0;}
  .stamp{
    position:absolute;
    right:6px;top:-58px;
    font-family:var(--font-mono);
    font-weight:700;
    font-size:14px;
    letter-spacing:1.5px;
    padding:8px 14px;
    border:3px double;
    border-radius:6px;
    text-transform:uppercase;
    transform:rotate(-9deg) scale(1);
    animation:stamp-in .35s cubic-bezier(.2,1.4,.4,1);
    pointer-events:none;
    background:rgba(255,253,247,.9);
    z-index:5;
    white-space:nowrap;
  }
  .stamp.clear{color:var(--green);border-color:var(--green);}
  .stamp.flag{color:var(--red);border-color:var(--red);}
  @keyframes stamp-in{
    0%{opacity:0;transform:rotate(-9deg) scale(2.2);}
    60%{opacity:1;}
    100%{opacity:1;transform:rotate(-9deg) scale(1);}
  }
  .reveal-panel{
    margin-top:20px;
    padding-top:16px;
    border-top:1px dashed var(--paper-line);
    animation:fade-up .3s ease;
  }
  @keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .principle-tag{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:1px;
    background:var(--ink);color:var(--brass-light);
    padding:4px 10px;border-radius:999px;
    margin-bottom:10px;
  }
  .explain-text{font-size:14px;line-height:1.75;color:var(--ink-soft);}
  .points-earned{
    font-family:var(--font-mono);font-size:13px;font-weight:700;
    color:var(--brass);margin-top:12px;
  }
  .btn-next{
    margin-top:18px;width:100%;
    background:var(--brass);color:var(--ink);
    font-family:var(--font-th);font-weight:700;font-size:14.5px;
    padding:13px;border:none;border-radius:4px;cursor:pointer;
  }
  .btn-next:hover{background:var(--brass-light);}
  .btn-next:disabled{opacity:.4;cursor:not-allowed;background:var(--brass);}
  .btn-next:disabled:hover{background:var(--brass);}

  /* ---------- END SCREEN ---------- */
  .end-card{
    background:var(--ink);color:var(--paper);
    border-radius:4px;padding:30px 22px;text-align:center;
  }
  .end-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--brass-light);text-transform:uppercase;}
  .end-score{font-family:var(--font-mono);font-size:52px;font-weight:700;margin:8px 0 2px;color:var(--brass-light);}
  .end-score-label{font-size:13px;color:rgba(243,238,225,.7);margin-bottom:22px;}
  .breakdown{display:flex;flex-direction:column;gap:7px;margin-bottom:22px;text-align:left;}
  .breakdown-item{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.05);
    border-radius:4px;padding:9px 11px;font-size:13px;
  }
  .breakdown-item .bi-cat{flex:1;}
  .breakdown-item .bi-pts{font-family:var(--font-mono);color:var(--brass-light);}
  .btn-submit{
    width:100%;background:var(--brass);color:var(--ink);
    font-family:var(--font-th);font-weight:700;font-size:15px;
    padding:14px;border:none;border-radius:4px;cursor:pointer;
  }
  .submitted-note{font-size:12.5px;color:rgba(243,238,225,.7);margin-top:12px;}
  .rank-callout{
    background:rgba(185,134,43,.15);border:1px solid var(--brass);
    border-radius:6px;padding:12px;margin-top:14px;
    font-family:var(--font-mono);font-size:13px;color:var(--brass-light);
  }
  .btn-replay{
    width:100%;background:transparent;color:var(--brass-light);
    font-family:var(--font-th);font-weight:600;font-size:13.5px;
    padding:11px;border:1px solid var(--brass);border-radius:4px;cursor:pointer;
    margin-top:10px;
  }
  .btn-replay:hover{background:rgba(185,134,43,.15);}

  /* ---------- LEADERBOARD PAGE ---------- */
  .lb-page{
    background:var(--paper-card);
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:22px 20px 24px;
    box-shadow:0 1px 0 var(--paper-line), 0 8px 24px -14px rgba(27,36,48,.25);
    animation:fade-up .3s ease;
  }
  .lb-page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .lb-page-head h2{font-size:18px;margin:0;}
  .lb-back{
    background:none;border:1px solid var(--paper-line);border-radius:999px;
    font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);
    cursor:pointer;padding:6px 12px;display:flex;align-items:center;gap:5px;
  }
  .lb-back:hover{border-color:var(--brass);color:var(--ink);}
  .lb-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .my-rank-card{
    background:var(--green-bg);border:1px solid var(--green);border-radius:6px;
    padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;
  }
  .my-rank-card .mrc-label{font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);letter-spacing:.5px;text-transform:uppercase;}
  .my-rank-card .mrc-rank{font-family:var(--font-mono);font-weight:700;font-size:20px;color:var(--green);}
  .my-rank-card .mrc-score{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--ink);}
  .lb-row{
    display:flex;align-items:center;gap:11px;
    padding:10px 8px;border-bottom:1px solid var(--paper-line);
  }
  .lb-row.me{background:var(--green-bg);border-radius:6px;border-bottom:1px solid transparent;}
  .lb-rank{
    font-family:var(--font-mono);font-weight:700;font-size:13px;
    width:26px;text-align:center;color:var(--ink-soft);flex-shrink:0;
  }
  .lb-rank.top1{color:var(--brass);}
  .lb-name-wrap{flex:1;min-width:0;}
  .lb-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-sub-name{font-size:11px;color:var(--ink-soft);}
  .lb-score{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--ink);flex-shrink:0;}
  .lb-empty{font-size:13.5px;color:var(--ink-soft);text-align:center;padding:30px 10px;}

  @media (max-width:360px){
    .end-score{font-size:44px;}
    .lang-btn{padding:6px 7px;font-size:11.5px;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){

  const TRANSLATIONS = {

  const POINTS_PER_CORRECT = 10;
  const POINTS_PER_GROUP = 10;

  // Google Apps Script webhook (same backend already used by Scope Detective / ESG Pillars Quest).
  // Data routes to its own "Ethics_Responses" sheet tab via the quest field below.
  const GOOGLE_SHEETS_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwSOUBZuylkpWQSuy5u53CSq4SlwJRmgwi_HgBYDkdRB7PWvXcFv_yKbAphXpBdm8fd4A/exec';
  const QUEST_ID = 'Business_Ethics';

  const app = document.getElementById('app');
  const state = {
    lang: 'en',
    screen: 'intro',
    name: '',
    email: '',
    deptCountry: '',
    submittedName: null,
    submittedScore: null,
    index: 0,
    score: 0,
    selected: null,
    revealed: false,
    currentOptions: [],
    multiSelected: [],
    photos: [],
    history: [],
    previousScreen: 'intro',
    leaderboard: [],
    lbLoading: false,
    submitted: false,
    pollTimer: null
  };

  function t(key){
    const v = TRANSLATIONS[state.lang][key];
    return v;
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  function setLang(lang){
    state.lang = lang;
    render();
  }

  function loadQuestion(i){
    state.index = i;
    state.selected = null;
    state.revealed = false;
    state.multiSelected = [];
    state.photos = [];
    const c = CASES[i];
    state.currentOptions = c.type === 'photo' ? [] : shuffle(c.options);
    render();
  }

  function toggleMultiOption(key){
    if(state.revealed) return;
    const idx = state.multiSelected.indexOf(key);
    if(idx >= 0) state.multiSelected.splice(idx, 1);
    else state.multiSelected.push(key);
    render();
  }

  function confirmMultiAnswer(){
    if(state.revealed) return;
    state.revealed = true;
    const c = CASES[state.index];
    const correctGroups = new Set();
    state.multiSelected.forEach(key => {
      const opt = c.options.find(o => o.key === key);
      if(opt && opt.groupId) correctGroups.add(opt.groupId);
    });
    const pts = correctGroups.size * POINTS_PER_GROUP;
    state.score += pts;
    state.history.push({ cat: c.cat, icon: c.icon, correct: pts > 0, pts, multi: true });
    render();
  }

  const MAX_PHOTOS = 5;
  const PHOTO_MAX_WIDTH = 1200;
  const PHOTO_JPEG_QUALITY = 0.7;

  function handlePhotoFiles(fileList){
    const remaining = MAX_PHOTOS - state.photos.length;
    if(remaining <= 0) return;
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/')).slice(0, remaining);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, PHOTO_MAX_WIDTH / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', PHOTO_JPEG_QUALITY);
          if(state.photos.length < MAX_PHOTOS){
            state.photos.push(dataUrl);
            render();
          }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function removePhoto(idx){
    state.photos.splice(idx, 1);
    render();
  }

  function confirmPhotoSection(skip){
    const c = CASES[state.index];
    if(skip){
      state.photos = [];
      state.history.push({ cat: c.cat, icon: c.icon, correct: null, pts: 0, skipped: true });
    } else {
      state.history.push({ cat: c.cat, icon: c.icon, correct: null, pts: 0, pending: true });
    }
    nextQuestion();
  }

  function selectOption(optIdx){
    if(state.revealed) return;
    state.selected = optIdx;
    state.revealed = true;
    const opt = state.currentOptions[optIdx];
    const pts = opt.correct ? POINTS_PER_CORRECT : 0;
    state.score += pts;
    state.history.push({ cat: CASES[state.index].cat, icon: CASES[state.index].icon, correct: opt.correct, pts });
    render();
  }

  function nextQuestion(){
    if(state.index < CASES.length - 1){
      loadQuestion(state.index + 1);
    } else {
      state.screen = 'end';
      submitScore();
    }
  }

  function submitScore(){
    if(state.submitted) return;
    state.submitted = true;
    state.submittedName = state.name.trim();
    state.submittedScore = state.score;
    render();

    if(GOOGLE_SHEETS_WEBHOOK_URL){
      const h = state.history;
      const payload = {
        quest: QUEST_ID,
        name: state.name,
        email: state.email,
        dept: state.deptCountry,
        c1Pts: h[0] ? h[0].pts : 0,
        c2Pts: h[1] ? h[1].pts : 0,
        c3Pts: h[2] ? h[2].pts : 0,
        c4Pts: h[3] ? h[3].pts : 0,
        c5Pts: h[4] ? h[4].pts : 0,
        c6Pts: h[5] ? h[5].pts : 0,
        c7Pts: h[6] ? h[6].pts : 0,
        totalScore: state.score,
        photos: state.photos,
        photoCount: state.photos.length,
        finishedAt: new Date().toISOString(),
        lang: state.lang
      };
      // Apps Script web apps don't reliably send CORS headers back for a normal fetch,
      // so this is fire-and-forget (mode: 'no-cors') — we don't read the response,
      // we just trust the POST landed and move straight to the leaderboard.
      fetch(GOOGLE_SHEETS_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      }).catch(()=>{});
    }

    openLeaderboard();
  }

  function normalizeLeaderboardEntries(raw){
    if(!Array.isArray(raw)) return [];
    return raw
      .filter(p => p && p.name)
      .map(p => ({ name: p.name, deptCountry: p.dept || '', score: parseInt(p.score, 10) || 0 }))
      .sort((a,b) => b.score - a.score);
  }

  function fetchLeaderboard(){
    if(!GOOGLE_SHEETS_WEBHOOK_URL){
      state.lbLoading = false;
      return;
    }
    state.lbLoading = true;
    const url = GOOGLE_SHEETS_WEBHOOK_URL + '?quest=' + encodeURIComponent(QUEST_ID);
    fetch(url)
      .then(r => { if(!r.ok) throw new Error('bad status'); return r.json(); })
      .then(players => {
        state.leaderboard = normalizeLeaderboardEntries(players);
        state.lbLoading = false;
        if(state.screen === 'leaderboard') renderLeaderboardPanelOnly();
      })
      .catch(() => fetchLeaderboardViaJsonp());
  }

  // Fallback for when a direct fetch() to Apps Script is blocked by CORS/ORB —
  // loading the same endpoint as a <script> tag with a callback param sidesteps that.
  function fetchLeaderboardViaJsonp(){
    const callbackName = 'ethicsLbCb_' + Date.now();
    const scriptEl = document.createElement('script');
    const cleanup = () => {
      delete window[callbackName];
      if(scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
    };
    window[callbackName] = function(players){
      state.leaderboard = normalizeLeaderboardEntries(players);
      state.lbLoading = false;
      if(state.screen === 'leaderboard') renderLeaderboardPanelOnly();
      cleanup();
    };
    scriptEl.onerror = () => {
      state.lbLoading = false;
      if(state.screen === 'leaderboard') renderLeaderboardPanelOnly();
      cleanup();
    };
    scriptEl.src = GOOGLE_SHEETS_WEBHOOK_URL + '?quest=' + encodeURIComponent(QUEST_ID) + '&callback=' + callbackName;
    document.body.appendChild(scriptEl);
  }

  function openLeaderboard(){
    if(state.screen !== 'leaderboard') state.previousScreen = state.screen;
    state.screen = 'leaderboard';
    render();
    fetchLeaderboard();
    if(state.pollTimer) clearInterval(state.pollTimer);
    state.pollTimer = setInterval(fetchLeaderboard, 5000);
  }

  function closeLeaderboard(){
    state.screen = state.previousScreen || 'intro';
    if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
    render();
  }

  function progressDotsHTML(){
    let html = '<div class="progress-row">';
    for(let i=0;i<CASES.length;i++){
      let cls = 'progress-dot';
      if(state.screen === 'question'){
        if(i < state.index) cls += ' done';
        else if(i === state.index) cls += ' current';
      } else if(state.screen === 'end'){
        cls += ' done';
      }
      html += `<div class="${cls}"></div>`;
    }
    html += '</div>';
    return html;
  }

  function topbarHTML(){
    const langs = [['en','EN'],['th','TH'],['de','DE'],['zh','中文']];
    const langBtns = langs.map(([code,label]) =>
      `<button class="lang-btn ${state.lang===code?'active':''}" data-lang="${code}">${label}</button>`
    ).join('');
    return `
      <div class="topbar">
        <div class="topbar-row">
          <div class="brand">
            <div class="kicker">${t('kicker')}</div>
            <div class="title">${t('title')}</div>
          </div>
          <div class="topbar-actions">
            <div class="lang-switch">${langBtns}</div>
          </div>
        </div>
        <div class="topbar-row" style="margin-top:10px;">
          <button class="lb-btn" id="lbToggle"><span class="lb-dot"></span>${t('lbBtn')}</button>
          <div></div>
        </div>
        ${(state.screen !== 'intro' && state.screen !== 'leaderboard') ? progressDotsHTML() : ''}
      </div>
    `;
  }

  function introHTML(){
    const chips = CASES
      .filter(c => c.type !== 'multi' && c.type !== 'photo')
      .map(c => `<span class="case-chip">${c.icon} ${esc(c.cat[state.lang])}</span>`)
      .join('');
    return `
      <div class="intro-card">
        <div class="folder-tab">NEW CASE</div>
        <h1>${t('introTitle')}</h1>
        <p>${t('introBody')}</p>
        <div class="case-list">${chips}</div>

        <div class="field-group">
          <input type="text" class="text-input" id="nameInput" placeholder="${t('namePlaceholder')}" maxlength="40" value="${esc(state.name)}">
        </div>
        <div class="field-group">
          <input type="email" class="text-input" id="emailInput" placeholder="${t('emailPlaceholder')}" maxlength="60" value="${esc(state.email)}">
        </div>
        <div class="field-group">
          <input type="text" class="text-input" id="deptInput" placeholder="${t('deptPlaceholder')}" maxlength="60" value="${esc(state.deptCountry)}">
        </div>
        <div class="privacy-note">${t('privacyNote')}</div>
        <button class="btn-primary" id="startBtn">${t('startBtn')}</button>
      </div>
    `;
  }

  function questionHTML(){
    const c = CASES[state.index];
    if(c.type === 'multi') return multiQuestionHTML(c);
    if(c.type === 'photo') return photoQuestionHTML(c);
    return singleQuestionHTML(c);
  }

  function singleQuestionHTML(c){
    let optionsHTML = '';
    state.currentOptions.forEach((opt, i) => {
      let cls = 'option';
      if(state.revealed){
        cls += ' disabled';
        if(opt.correct) cls += ' correct';
        else if(i === state.selected) cls += ' wrong-selected';
        else cls += ' dim';
      }
      const letter = String.fromCharCode(65+i);
      optionsHTML += `
        <div class="${cls}" data-idx="${i}">
          <div class="opt-letter">${letter}</div>
          <div>${esc(opt[state.lang])}</div>
        </div>
      `;
    });

    let stampHTML = '';
    let revealHTML = '';
    if(state.revealed){
      const opt = state.currentOptions[state.selected];
      const pts = state.history[state.history.length-1].pts;
      stampHTML = `
        <div class="stamp-wrap">
          <div class="stamp ${opt.correct ? 'clear':'flag'}">${opt.correct ? t('stampClear') : t('stampFlag')}</div>
        </div>
      `;
      revealHTML = `
        <div class="reveal-panel">
          <div class="principle-tag">${t('principleLabel')}: ${esc(c.cat[state.lang])}</div>
          <div class="explain-text">${esc(c.explain[state.lang])}</div>
          <div class="points-earned">+${pts} ${t('pointsSuffix')}</div>
          <button class="btn-next" id="nextBtn">${state.index === CASES.length-1 ? t('lastNextBtn') : t('nextBtn')}</button>
        </div>
      `;
    }

    return `
      <div class="case-card">
        <div class="case-meta">
          <div class="case-icon">${c.icon}</div>
          <div class="case-meta-text">
            <div class="case-no">${t('caseLabel')} 0${state.index+1} / 0${CASES.length}</div>
            <div class="case-cat">${esc(c.cat[state.lang])}</div>
          </div>
        </div>
        <div class="scenario-text">${esc(c.scenario[state.lang])}</div>
        <div class="prompt-label">${t('whatWouldYouDo')}</div>
        <div class="options">${optionsHTML}</div>
        ${stampHTML}
        ${revealHTML}
      </div>
    `;
  }

  function multiQuestionHTML(c){
    let optionsHTML = '';
    state.currentOptions.forEach((opt) => {
      const isChecked = state.multiSelected.indexOf(opt.key) >= 0;
      let cls = 'option ms-option';
      let mark = '';
      if(state.revealed){
        cls += ' disabled';
        if(isChecked && opt.groupId) { cls += ' correct'; mark = '✅'; }
        else if(isChecked && !opt.groupId) { cls += ' wrong-selected'; mark = '❌'; }
        else if(!isChecked && opt.groupId) { cls += ' missed'; mark = '⚠️'; }
        else { cls += ' dim'; mark = ''; }
      } else if(isChecked){
        cls += ' ms-checked';
      }
      optionsHTML += `
        <div class="${cls}" data-key="${opt.key}">
          <div class="opt-checkbox">${state.revealed ? mark : (isChecked ? '✓' : '')}</div>
          <div>${esc(opt[state.lang])}</div>
        </div>
      `;
    });

    let revealHTML = '';
    if(state.revealed){
      const h = state.history[state.history.length-1];
      const groupOrder = ['g1','g2','g3','g4'];
      const explainItems = groupOrder.map(g => `
        <div class="ms-explain-item">${esc(c.groupExplain[g][state.lang])}</div>
      `).join('');
      revealHTML = `
        <div class="reveal-panel">
          <div class="principle-tag">${t('principleLabel')}</div>
          <div class="ms-explain-list">${explainItems}</div>
          <div class="points-earned">+${h.pts} ${t('pointsSuffix')}</div>
          <button class="btn-next" id="nextBtn">${state.index === CASES.length-1 ? t('lastNextBtn') : t('nextBtn')}</button>
        </div>
      `;
    }

    const confirmDisabled = state.revealed ? 'disabled' : '';

    return `
      <div class="case-card">
        <div class="case-meta">
          <div class="case-icon">${c.icon}</div>
          <div class="case-meta-text">
            <div class="case-no">${t('caseLabel')} 0${state.index+1} / 0${CASES.length}</div>
            <div class="case-cat">${esc(c.cat[state.lang])}</div>
          </div>
        </div>
        <div class="scenario-text">${c.scenario[state.lang].map(p => `<p>${esc(p)}</p>`).join('')}</div>
        <div class="prompt-label">${t('multiPrompt')}</div>
        <div class="options">${optionsHTML}</div>
        ${!state.revealed ? `<button class="btn-next" id="confirmMultiBtn" ${confirmDisabled}>${t('confirmBtn')}</button>` : ''}
        ${revealHTML}
      </div>
    `;
  }

  function photoQuestionHTML(c){
    const thumbs = state.photos.map((src, i) => `
      <div class="photo-thumb">
        <img src="${src}" alt="photo ${i+1}">
        <button type="button" class="photo-remove" data-idx="${i}">✕</button>
      </div>
    `).join('');

    const addTile = state.photos.length < MAX_PHOTOS ? `
      <label class="photo-add-tile">
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
        <span>${t('addPhotoBtn')}</span>
      </label>
    ` : '';

    return `
      <div class="case-card bonus-card">
        <div class="case-meta">
          <div class="case-icon bonus-icon">${c.icon}</div>
          <div class="case-meta-text">
            <div class="case-no">${t('caseLabel')} 0${state.index+1} / 0${CASES.length}</div>
            <div class="case-cat">${esc(c.cat[state.lang])} <span class="bonus-badge">${t('bonusLabel')}</span></div>
          </div>
        </div>
        <div class="prompt-label">${t('photoPrompt')}</div>
        <div class="photo-hint">${t('photoHint')}</div>
        <div class="photo-grid">
          ${thumbs}
          ${addTile}
        </div>
        <div class="photo-actions">
          <button class="btn-skip" id="photoSkipBtn">${t('skipBtn')}</button>
          <button class="btn-next" id="photoSubmitBtn" ${state.photos.length === 0 ? 'disabled' : ''}>${t('submitPhotoBtn')}</button>
        </div>
      </div>
    `;
  }

  function endHTML(){
    const items = state.history.map(h => `
      <div class="breakdown-item">
        <span class="bi-cat">${h.icon} ${esc(h.cat[state.lang])}</span>
        <span class="bi-pts">${h.skipped ? t('skippedLabel') : h.pending ? t('pendingReview') : '+' + h.pts}</span>
      </div>
    `).join('');

    let rankHTML = '';
    if(state.submitted){
      const idx = findMyLeaderboardIndex();
      if(idx >= 0){
        rankHTML = `<div class="rank-callout">${t('myRankLabel')}: #${idx+1} ${t('of')} ${state.leaderboard.length} ${t('people')} · ${state.score} ${t('pointsSuffix')}</div>`;
      }
    }

    return `
      <div class="end-card">
        <div class="end-kicker">${t('endKicker')}</div>
        <div class="end-score">${state.score}</div>
        <div class="end-score-label">${t('endScoreLabel')(esc(state.name))}</div>
        <div class="breakdown">${items}</div>
        ${state.submitted
          ? `<div class="submitted-note">${t('submittedNote')}</div>${rankHTML}`
          : `<button class="btn-submit" id="submitBtn">${t('submitBtn')}</button>`
        }
        <button class="btn-replay" id="replayBtn">${t('replayBtn')}</button>
      </div>
    `;
  }

  function findMyLeaderboardIndex(){
    if(!state.submittedName) return -1;
    return state.leaderboard.findIndex(p =>
      p.name.trim().toLowerCase() === state.submittedName.toLowerCase() && p.score === state.submittedScore
    );
  }

  function lbRowsHTML(){
    if(state.lbLoading && state.leaderboard.length === 0){
      return `<div class="lb-empty">${t('lbLoading')}</div>`;
    }
    if(state.leaderboard.length === 0){
      return `<div class="lb-empty">${t('lbEmpty')}</div>`;
    }
    const myIdx = findMyLeaderboardIndex();
    let rows = '';
    state.leaderboard.slice(0, 50).forEach((p, i) => {
      const isMe = i === myIdx;
      rows += `
        <div class="lb-row ${isMe ? 'me' : ''}">
          <div class="lb-rank ${i===0?'top1':''}">${i+1}</div>
          <div class="lb-name-wrap">
            <div class="lb-name">${esc(p.name)}${isMe ? ' ' + t('you') : ''}</div>
            ${p.deptCountry ? `<div class="lb-sub-name">${esc(p.deptCountry)}</div>` : ''}
          </div>
          <div class="lb-score">${p.score}</div>
        </div>
      `;
    });
    return rows;
  }

  function myRankCardHTML(){
    const idx = findMyLeaderboardIndex();
    if(idx < 0) return '';
    return `
      <div class="my-rank-card">
        <div>
          <div class="mrc-label">${t('myRankLabel')}</div>
          <div class="mrc-score">${t('of')} ${state.leaderboard.length} ${t('people')}</div>
        </div>
        <div class="mrc-rank">#${idx+1}</div>
      </div>
    `;
  }

  function leaderboardPageHTML(){
    return `
      <div class="lb-page">
        <div class="lb-page-head">
          <h2>${t('lbTitle')}</h2>
          <button class="lb-back" id="lbClose">← ${t('backBtn')}</button>
        </div>
        <div class="lb-sub">${t('lbSub')}</div>
        <div id="myRankCard">${myRankCardHTML()}</div>
        <div id="lbRows">${lbRowsHTML()}</div>
      </div>
    `;
  }

  function renderLeaderboardPanelOnly(){
    const rowsEl = document.getElementById('lbRows');
    const myRankEl = document.getElementById('myRankCard');
    if(rowsEl) rowsEl.innerHTML = lbRowsHTML();
    if(myRankEl) myRankEl.innerHTML = myRankCardHTML();
  }

  function render(){
    let bodyHTML = '';
    if(state.screen === 'intro') bodyHTML = introHTML();
    else if(state.screen === 'question') bodyHTML = questionHTML();
    else if(state.screen === 'end') bodyHTML = endHTML();
    else if(state.screen === 'leaderboard') bodyHTML = leaderboardPageHTML();

    app.innerHTML = `
      ${topbarHTML()}
      <div class="main">${bodyHTML}</div>
    `;
    attachHandlers();
  }

  function attachHandlers(){
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.onclick = () => setLang(btn.getAttribute('data-lang'));
    });

    const lbToggle = document.getElementById('lbToggle');
    if(lbToggle) lbToggle.onclick = openLeaderboard;

    const lbClose = document.getElementById('lbClose');
    if(lbClose) lbClose.onclick = closeLeaderboard;

    const startBtn = document.getElementById('startBtn');
    if(startBtn) startBtn.onclick = () => {
      const nameInput = document.getElementById('nameInput');
      const emailInput = document.getElementById('emailInput');
      const deptInput = document.getElementById('deptInput');
      const name = nameInput.value.trim();
      if(!name){ nameInput.focus(); nameInput.style.borderColor = 'var(--red)'; return; }
      state.name = name;
      state.email = emailInput.value.trim();
      state.deptCountry = deptInput.value.trim();
      state.screen = 'question';
      loadQuestion(0);
    };

    ['nameInput','emailInput','deptInput'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') document.getElementById('startBtn').click();
      });
    });

    document.querySelectorAll('.option').forEach(el => {
      if(el.classList.contains('ms-option')){
        el.onclick = () => {
          if(state.revealed) return;
          toggleMultiOption(el.getAttribute('data-key'));
        };
      } else {
        el.onclick = () => {
          if(state.revealed) return;
          selectOption(parseInt(el.getAttribute('data-idx'), 10));
        };
      }
    });

    const confirmMultiBtn = document.getElementById('confirmMultiBtn');
    if(confirmMultiBtn) confirmMultiBtn.onclick = confirmMultiAnswer;

    const photoInput = document.getElementById('photoInput');
    if(photoInput) photoInput.onchange = (e) => {
      handlePhotoFiles(e.target.files);
      e.target.value = '';
    };

    document.querySelectorAll('.photo-remove').forEach(btn => {
      btn.onclick = () => removePhoto(parseInt(btn.getAttribute('data-idx'), 10));
    });

    const photoSkipBtn = document.getElementById('photoSkipBtn');
    if(photoSkipBtn) photoSkipBtn.onclick = () => confirmPhotoSection(true);

    const photoSubmitBtn = document.getElementById('photoSubmitBtn');
    if(photoSubmitBtn) photoSubmitBtn.onclick = () => {
      if(state.photos.length === 0) return;
      confirmPhotoSection(false);
    };

    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.onclick = nextQuestion;

    const submitBtn = document.getElementById('submitBtn');
    if(submitBtn) submitBtn.onclick = submitScore;

    const replayBtn = document.getElementById('replayBtn');
    if(replayBtn) replayBtn.onclick = resetGame;
  }

  function resetGame(){
    state.screen = 'intro';
    state.index = 0;
    state.score = 0;
    state.selected = null;
    state.revealed = false;
    state.currentOptions = [];
    state.multiSelected = [];
    state.photos = [];
    state.history = [];
    state.submitted = false;
    state.submittedName = null;
    state.submittedScore = null;
    render();
  }

  render();
})();
</script>
</body>
</html>
